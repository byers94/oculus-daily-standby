<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oculus Dispatch — Daily Standby Roster</title>
    <style>
        :root {
            --primary-bg: #f3f4f6;
            --card-bg: #ffffff;
            --oculus-blue: #1e3a8a;
            --oculus-dark: #0f172a;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --info: #3b82f6;
            --gray: #6b7280;
            --text-main: #1f2937;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--primary-bg);
            margin: 0;
            padding: 0;
            color: var(--text-main);
        }
        header {
            background-color: var(--oculus-blue);
            color: white;
            padding: 18px 15px 14px 15px;
            text-align: center;
        }
        header h1 {
            margin: 0;
            font-size: 21px;
            letter-spacing: 0.6px;
        }
        header p {
            margin: 4px 0 0 0;
            font-size: 13px;
            opacity: 0.85;
        }
        .date-banner {
            background-color: var(--oculus-dark);
            color: #38bdf8;
            text-align: center;
            padding: 9px 12px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.4px;
            border-bottom: 2px solid #2563eb;
        }
        .container {
            max-width: 900px;
            margin: 18px auto 35px auto;
            padding: 0 15px;
        }

        /* Live Stats Bar */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 16px;
        }
        .stat-box {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 12px 10px;
            text-align: center;
            box-shadow: 0 1px 4px rgba(0,0,0,0.07);
            border-top: 3px solid var(--oculus-blue);
        }
        .stat-box.active-stat { border-top-color: var(--success); }
        .stat-box.called-stat { border-top-color: var(--warning); }
        .stat-box.assigned-stat { border-top-color: var(--info); }
        .stat-num {
            font-size: 24px;
            font-weight: 800;
            line-height: 1.1;
            color: var(--text-main);
        }
        .stat-label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--gray);
            margin-top: 4px;
        }

        /* Filter Panel */
        .filter-panel {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 16px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.07);
        }
        .filter-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1.3fr;
            gap: 10px;
            margin-bottom: 10px;
        }
        @media (max-width: 650px) {
            .filter-row {
                grid-template-columns: 1fr;
            }
        }
        .filter-group label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--gray);
            margin-bottom: 4px;
        }
        .filter-group select,
        .filter-group input {
            width: 100%;
            padding: 9px 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
            background: #fff;
        }
        .toggle-row {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            padding-top: 8px;
            border-top: 1px solid #f1f5f9;
            font-size: 13px;
            font-weight: 600;
            color: #475569;
        }
        .toggle-row label {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        /* Guard Cards */
        .guard-card {
            background: var(--card-bg);
            border-radius: 9px;
            padding: 16px 18px;
            margin-bottom: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.06);
            border-left: 5px solid var(--success);
        }
        .guard-card.status-Called {
            border-left-color: var(--warning);
            background-color: #fffbeb;
        }
        .guard-card.status-Assigned {
            border-left-color: var(--info);
            background-color: #eff6ff;
            opacity: 0.85;
        }
        .guard-card.status-Withdrawn {
            border-left-color: var(--gray);
            background-color: #f9fafb;
            opacity: 0.6;
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid #e5e7eb;
        }
        .guard-name {
            margin: 0;
            font-size: 18px;
            font-weight: 800;
            color: var(--oculus-blue);
        }
        .guard-sub {
            font-size: 13px;
            color: #4b5563;
            margin-top: 2px;
        }

        .badge-group {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: flex-end;
        }
        .badge {
            padding: 4px 9px;
            border-radius: 14px;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .badge-armed { background: #fee2e2; color: #991b1b; }
        .badge-unarmed { background: #e0e7ff; color: #1e40af; }
        .badge-patrol { background: #fef3c7; color: #92400e; }

        .badge-ot-safe { background: #d1fae5; color: #065f46; }
        .badge-ot-warn { background: #fef3c7; color: #92400e; }
        .badge-ot-risk { background: #fee2e2; color: #991b1b; }

        .badge-status-Active { background: #10b981; color: white; }
        .badge-status-Called { background: #f59e0b; color: white; }
        .badge-status-Assigned { background: #3b82f6; color: white; }
        .badge-status-Withdrawn { background: #6b7280; color: white; }

        .details-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px 16px;
            font-size: 13.5px;
            margin-bottom: 10px;
        }
        @media (max-width: 600px) {
            .details-grid {
                grid-template-columns: 1fr;
            }
        }
        .detail-item strong {
            color: #374151;
        }
        .trained-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            padding: 8px 10px;
            font-size: 13px;
            margin-bottom: 10px;
        }
        .dispatch-note-box {
            background: #fef9c3;
            border: 1px solid #fde047;
            color: #854d0e;
            border-radius: 6px;
            padding: 7px 10px;
            font-size: 12.5px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        /* Action Buttons */
        .actions-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }
        .btn-act {
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            font-size: 12.5px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            color: white;
        }
        .btn-call { background-color: #0f172a; }
        .btn-call:hover { background-color: #1e293b; }
        .btn-sms { background-color: var(--oculus-blue); }
        .btn-sms:hover { background-color: #172554; }
        .btn-called { background-color: var(--warning); color: #fff; }
        .btn-called:hover { background-color: #d97706; }
        .btn-assigned { background-color: var(--success); }
        .btn-assigned:hover { background-color: #059669; }
        .btn-reset { background-color: #e5e7eb; color: #374151; }
        .btn-reset:hover { background-color: #d1d5db; }
        .btn-note { background-color: #f1f5f9; color: #334155; border: 1px solid #cbd5e1; }
        .btn-note:hover { background-color: #e2e8f0; }

        .empty-state {
            text-align: center;
            background: white;
            padding: 35px 20px;
            border-radius: 8px;
            color: var(--gray);
            font-size: 15px;
        }
    </style>
    <!-- Firebase SDKs (Matches Legacy Shift Board) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

    <header>
        <h1>OCULUS DISPATCH — DAILY STANDBY ROSTER</h1>
        <p>Live Same-Day On-Call Guard Availability &amp; Triage</p>
    </header>

    <div class="date-banner" id="today-banner">
        Loading Mountain Time Roster Date...
    </div>

    <div class="container">

        <!-- Live Counters -->
        <div class="stats-grid">
            <div class="stat-box active-stat">
                <div class="stat-num" id="count-active">0</div>
                <div class="stat-label">Available Now</div>
            </div>
            <div class="stat-box called-stat">
                <div class="stat-num" id="count-called">0</div>
                <div class="stat-label">Called / Pending</div>
            </div>
            <div class="stat-box assigned-stat">
                <div class="stat-num" id="count-assigned">0</div>
                <div class="stat-label">Assigned Today</div>
            </div>
        </div>

        <!-- Filters -->
        <div class="filter-panel">
            <div class="filter-row">
                <div class="filter-group">
                    <label for="filter-clearance">Clearance / License</label>
                    <select id="filter-clearance" onchange="renderRoster()">
                        <option value="ALL">All Clearances</option>
                        <option value="Armed">Armed Only</option>
                        <option value="Unarmed">Unarmed Only</option>
                        <option value="Patrol / Driver">Mobile Patrol / MVR</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="filter-ot">Overtime Filter</label>
                    <select id="filter-ot" onchange="renderRoster()">
                        <option value="ALL">All Hours Statuses</option>
                        <option value="STRAIGHT_ONLY">Straight Time Only (&lt;32 hrs)</option>
                        <option value="NO_OT">Exclude 40+ hr OT Risk</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="filter-search">Search Trained Site or Officer</label>
                    <input type="text" id="filter-search" oninput="renderRoster()" placeholder="e.g. Forge, Meridian, Vance...">
                </div>
            </div>
            <div class="toggle-row">
                <label>
                    <input type="checkbox" id="hide-withdrawn" checked onchange="renderRoster()">
                    Hide Withdrawn Officers
                </label>
                <label>
                    <input type="checkbox" id="hide-assigned" onchange="renderRoster()">
                    Hide Already Assigned
                </label>
            </div>
        </div>

        <!-- Roster List -->
        <div id="roster-feed">
            <div class="empty-state">Syncing today's standby check-ins...</div>
        </div>

    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyD-SxQG5H-gD5UbwbG-PEzu6buAuOFbKSw",
            authDomain: "oculus-opne-shift-board.firebaseapp.com",
            projectId: "oculus-opne-shift-board",
            storageBucket: "oculus-opne-shift-board.firebasestorage.app",
            messagingSenderId: "282551856349",
            appId: "1:282551856349:web:981dcb99fa0a3762353f34"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Compute strict Mountain Time YYYY-MM-DD so midnight reset aligns with guard check-in page
        function getMountainDateInfo() {
            const now = new Date();
            const activeDate = new Intl.DateTimeFormat('en-CA', {
                timeZone: 'America/Denver',
                year: 'numeric',
                month: '2-digit',
                day: '2-digit'
            }).format(now);

            const readableDate = new Intl.DateTimeFormat('en-US', {
                timeZone: 'America/Denver',
                weekday: 'long',
                month: 'short',
                day: 'numeric',
                year: 'numeric'
            }).format(now);

            return { activeDate, readableDate };
        }

        const { activeDate, readableDate } = getMountainDateInfo();
        document.getElementById('today-banner').innerText = `📅 DISPATCH ROSTER FOR: ${readableDate.toUpperCase()} (${activeDate})`;

        let allStandbyDocs = [];

        // Escape HTML safely before injecting user-typed strings
        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        // Real-time listener for TODAY'S check-ins only (no composite index needed)
        db.collection('daily_standby')
            .where('activeDate', '==', activeDate)
            .onSnapshot((snapshot) => {
                allStandbyDocs = [];
                snapshot.forEach((doc) => {
                    allStandbyDocs.push({ id: doc.id, ...doc.data() });
                });

                // Sort: Active first, then Called, then Assigned, then Withdrawn; within group, earliest check-in first
                const statusOrder = { 'Active': 1, 'Called': 2, 'Assigned': 3, 'Withdrawn': 4 };
                allStandbyDocs.sort((a, b) => {
                    const rankA = statusOrder[a.status] || 9;
                    const rankB = statusOrder[b.status] || 9;
                    if (rankA !== rankB) return rankA - rankB;
                    const timeA = a.checkedInAt ? a.checkedInAt.toMillis() : 0;
                    const timeB = b.checkedInAt ? b.checkedInAt.toMillis() : 0;
                    return timeA - timeB;
                });

                updateStats();
                renderRoster();
            }, (error) => {
                document.getElementById('roster-feed').innerHTML =
                    `<div class="empty-state" style="color:#dc2626;">Error loading standby roster: ${escapeHtml(error.message)}</div>`;
            });

        function updateStats() {
            const activeCount = allStandbyDocs.filter(d => d.status === 'Active').length;
            const calledCount = allStandbyDocs.filter(d => d.status === 'Called').length;
            const assignedCount = allStandbyDocs.filter(d => d.status === 'Assigned').length;

            document.getElementById('count-active').innerText = activeCount;
            document.getElementById('count-called').innerText = calledCount;
            document.getElementById('count-assigned').innerText = assignedCount;
        }

        function renderRoster() {
            const feed = document.getElementById('roster-feed');
            const clearanceFilter = document.getElementById('filter-clearance').value;
            const otFilter = document.getElementById('filter-ot').value;
            const searchQuery = document.getElementById('filter-search').value.trim().toLowerCase();
            const hideWithdrawn = document.getElementById('hide-withdrawn').checked;
            const hideAssigned = document.getElementById('hide-assigned').checked;

            const filtered = allStandbyDocs.filter((g) => {
                if (hideWithdrawn && g.status === 'Withdrawn') return false;
                if (hideAssigned && g.status === 'Assigned') return false;
                if (clearanceFilter !== 'ALL' && g.clearanceType !== clearanceFilter) return false;

                if (otFilter === 'STRAIGHT_ONLY' && !(g.otStatus || '').startsWith('Straight Time')) return false;
                if (otFilter === 'NO_OT' && (g.otStatus || '').startsWith('In Overtime')) return false;

                if (searchQuery) {
                    const haystack = `${g.guardName || ''} ${g.trainedSites || ''} ${g.phone || ''}`.toLowerCase();
                    if (!haystack.includes(searchQuery)) return false;
                }
                return true;
            });

            if (filtered.length === 0) {
                feed.innerHTML = `<div class="empty-state">No standby officers match your current filters for today.</div>`;
                return;
            }

            feed.innerHTML = filtered.map((g) => {
                // Clearance badge style
                let clearClass = 'badge-unarmed';
                if (g.clearanceType === 'Armed') clearClass = 'badge-armed';
                if ((g.clearanceType || '').includes('Patrol')) clearClass = 'badge-patrol';

                // OT badge style
                let otClass = 'badge-ot-safe';
                let otShort = 'Straight Time';
                if ((g.otStatus || '').startsWith('Close to OT')) {
                    otClass = 'badge-ot-warn';
                    otShort = '32–39 Hrs (Watch OT)';
                } else if ((g.otStatus || '').startsWith('In Overtime')) {
                    otClass = 'badge-ot-risk';
                    otShort = 'OT Risk (40+ Hrs)';
                }

                const cleanDigits = (g.phone || '').replace(/\D/g, '');
                const smsText = encodeURIComponent(`Hi ${g.guardName}, this is Oculus Dispatch. You checked in on today's standby list—are you still available to cover a last-minute shift?`);

                const checkedInStr = g.checkedInAt
                    ? new Date(g.checkedInAt.toMillis()).toLocaleTimeString('en-US', { timeZone: 'America/Denver', hour: '2-digit', minute: '2-digit' })
                    : 'Just now';

                const noteHtml = g.dispatchNotes
                    ? `<div class="dispatch-note-box">📝 Dispatch Note: ${escapeHtml(g.dispatchNotes)}</div>`
                    : '';

                return `
                    <div class="guard-card status-${escapeHtml(g.status)}">
                        <div class="card-top">
                            <div>
                                <h3 class="guard-name">${escapeHtml(g.guardName)}</h3>
                                <div class="guard-sub">📞 ${escapeHtml(g.phone)} &bull; Prefers: <strong>${escapeHtml(g.contactPref)}</strong> &bull; Checked in: ${checkedInStr}</div>
                            </div>
                            <div class="badge-group">
                                <span class="badge ${clearClass}">${escapeHtml(g.clearanceType)}</span>
                                <span class="badge ${otClass}">${otShort}</span>
                                <span class="badge badge-status-${escapeHtml(g.status)}">${escapeHtml(g.status)}</span>
                            </div>
                        </div>

                        <div class="details-grid">
                            <div class="detail-item"><strong>Window Today:</strong> ${escapeHtml(g.availableFrom)} – ${escapeHtml(g.availableUntil)}</div>
                            <div class="detail-item"><strong>Notice Needed:</strong> ${escapeHtml(g.leadTime)} (${escapeHtml(g.maxShiftLength)})</div>
                        </div>

                        <div class="trained-box">
                            <strong>OJT / Trained Sites:</strong> ${escapeHtml(g.trainedSites || 'None specified')}
                        </div>

                        ${noteHtml}

                        <div class="actions-bar">
                            <a href="tel:${cleanDigits}" class="btn-act btn-call">📞 Call</a>
                            <a href="sms:${cleanDigits}?&body=${smsText}" class="btn-act btn-sms">💬 Text Offer</a>
                            ${g.status !== 'Called' ? `<button class="btn-act btn-called" onclick="setStatus('${g.id}', 'Called')">Mark Called</button>` : ''}
                            ${g.status !== 'Assigned' ? `<button class="btn-act btn-assigned" onclick="setStatus('${g.id}', 'Assigned')">Mark Assigned</button>` : ''}
                            ${g.status !== 'Active' ? `<button class="btn-act btn-reset" onclick="setStatus('${g.id}', 'Active')">Reset Active</button>` : ''}
                            <button class="btn-act btn-note" onclick="editNote('${g.id}', '${escapeHtml(g.dispatchNotes || '')}')">📝 Note</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function setStatus(docId, newStatus) {
            try {
                await db.collection('daily_standby').doc(docId).update({
                    status: newStatus,
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                });
            } catch (err) {
                alert("Error updating status: " + err.message);
            }
        }

        async function editNote(docId, currentNote) {
            const note = prompt("Enter dispatch note (e.g. 'Left VM at 14:15' or 'Assigned to Forge 18:00'):", currentNote);
            if (note === null) return;
            try {
                await db.collection('daily_standby').doc(docId).update({
                    dispatchNotes: note.trim(),
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                });
            } catch (err) {
                alert("Error saving note: " + err.message);
            }
        }
    </script>
</body>
</html>
